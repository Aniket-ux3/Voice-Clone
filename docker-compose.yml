services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: voice-clone-backend
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./checkpoints_v2:/app/checkpoints_v2
      - ./emotions:/app/emotions
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - voice-clone-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: voice-clone-frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - voice-clone-network

networks:
  voice-clone-network:
    driver: bridge

volumes:
  uploads:
  outputs:
